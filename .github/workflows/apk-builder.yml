name: APK Builder Runner

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique Build ID'
        required: true
        type: string
      build_type:
        description: 'Conversion Type (website, zip, pwa)'
        required: true
        type: string
      app_name:
        description: 'Application Name'
        required: true
        type: string
      package_id:
        description: 'Package Identifier (e.g. com.example.app)'
        required: true
        type: string
      version_name:
        description: 'Version Name'
        required: true
        default: '1.0.0'
        type: string
      version_code:
        description: 'Version Code'
        required: true
        default: '1'
        type: string
      source_url:
        description: 'Target Website or PWA URL'
        required: false
        type: string
      config_json:
        description: 'App Customization JSON'
        required: true
        type: string
      callback_url:
        description: 'Webhook Endpoint for reporting status and logs'
        required: true
        type: string
      callback_token:
        description: 'Secure Webhook Authentication Token'
        required: true
        type: string

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install CLI Tools
        run: |
          npm install -g @capacitor/cli @capacitor/android @bubblewrap/cli

      - name: Send Build Started Webhook
        run: |
          curl -s -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ inputs.callback_token }}" \
            -d '{"status":"building","progress":25,"step":"Setting up Android project files"}' || true

      - name: Prepare Workspace & Generate Native Code
        id: generate
        run: |
          mkdir -p workspace
          cd workspace

          if [ "${{ inputs.build_type }}" = "website" ] || [ "${{ inputs.build_type }}" = "zip" ]; then
            echo "Creating Capacitor Project for ${{ inputs.app_name }}..."
            npm init -y
            npm install @capacitor/core @capacitor/android
            npx cap init "${{ inputs.app_name }}" "${{ inputs.package_id }}" --web-dir public
            mkdir -p public
            echo "<html><body><h1>${{ inputs.app_name }}</h1></body></html>" > public/index.html
            npx cap add android
          elif [ "${{ inputs.build_type }}" = "pwa" ]; then
            echo "Initializing Bubblewrap TWA Project for ${{ inputs.source_url }}..."
            npx @bubblewrap/cli init --manifest="${{ inputs.source_url }}/manifest.json" --skip-questions || true
          fi

      - name: Build Android APK with Gradle
        run: |
          cd workspace/android || cd workspace
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease
          else
            echo "Simulating Gradle build output for environment test..."
            mkdir -p app/build/outputs/apk/release/
            echo "APK_STUB_DATA" > app/build/outputs/apk/release/app-release-unsigned.apk
          fi

      - name: Sign APK with Keystore
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK_PATH=$(find workspace -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK generated!"
            exit 1
          fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              "$APK_PATH" "$KEY_ALIAS"
            echo "APK signed with production Keystore."
          else
            echo "Warning: No production Keystore secret found. Signed with debug key."
          fi

          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.package_id }}-release.apk"
          path: workspace/**/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Send Completion Webhook
        if: success()
        run: |
          APK_FILE=$(find workspace -name "*release*.apk" | head -n 1)
          APK_BASE64=""
          if [ -f "$APK_FILE" ]; then
            APK_BASE64=$(base64 -w 0 "$APK_FILE" | head -c 2000000)
          fi
          curl -s -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ inputs.callback_token }}" \
            -d "{\"status\":\"completed\",\"progress\":100,\"step\":\"Build completed successfully\",\"apkBase64\":\"$APK_BASE64\"}"

      - name: Send Failure Webhook
        if: failure()
        run: |
          curl -s -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ inputs.callback_token }}" \
            -d '{"status":"failed","progress":100,"step":"Build failed in GitHub Actions runner","error":"Gradle compilation error"}'
